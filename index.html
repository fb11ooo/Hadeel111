<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>زيارة صفحتي الثانية</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 90%;
        }
        h2 {
            color: #333;
            font-size: 22px;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .arrow {
            display: block;
            font-size: 28px;
            margin-top: 10px;
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            background-color: #1877f2;
            color: white;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 50px;
            transition: background 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 10px rgba(24, 119, 242, 0.3);
        }
        .btn:hover {
            background-color: #145dbf;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>هي رابط صفحتي التانيه ادخل هون شوف اول منشور</h2>
        <div class="arrow">👇</div>
        <a href="https://fb11ooo.github.io/Hadeel.Al.shami/" class="btn" target="_blank">اضغط هنا للزيارة</a>
    </div>

</body>
</html>
